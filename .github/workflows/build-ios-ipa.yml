# trigger spotlight author field and reader nav auto-hide build
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ios-stability-20260623
    paths:
      - '.github/workflows/build-ios-ipa.yml'

permissions:
  contents: read

env:
  IPA_NAME: Otzaria-unsigned
  ALTSTORE_DISPLAY_NAME: Otzaria

jobs:
  build-ios-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Apply iPad reader navigation auto-hide patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/navigation/view/main_window_screen.dart')
          text = path.read_text()

          text = text.replace(
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/rendering.dart' show ScrollDirection;\n",
              1,
          )

          text = text.replace(
              "  bool _isReadingSettingsPanelOpen = false;\n",
              "  bool _isReadingSettingsPanelOpen = false;\n  bool _hideBottomNavOnReaderScroll = false;\n",
              1,
          )

          methods = """
  void _setBottomNavHiddenByReaderScroll(bool hidden) {
    if (_hideBottomNavOnReaderScroll == hidden) {
      return;
    }
    setState(() {
      _hideBottomNavOnReaderScroll = hidden;
    });
  }

  bool _handleReaderScrollNotification(
    ScrollNotification notification, {
    required Orientation orientation,
    required Screen currentScreen,
  }) {
    if (orientation != Orientation.portrait || currentScreen != Screen.reading) {
      return false;
    }

    if (notification is UserScrollNotification) {
      if (notification.direction == ScrollDirection.reverse) {
        _setBottomNavHiddenByReaderScroll(true);
      } else if (notification.direction == ScrollDirection.forward) {
        _setBottomNavHiddenByReaderScroll(false);
      }
    }

    return false;
  }

"""
          marker = "  void _toggleReadingSettingsPanel() {\n"
          if methods not in text:
            text = text.replace(marker, methods + marker, 1)

          text = text.replace(
              "    if (!mounted || !context.mounted) return;\n\n",
              "    if (!mounted || !context.mounted) return;\n\n"
              "    if (state.currentScreen != Screen.reading && _hideBottomNavOnReaderScroll) {\n"
              "      setState(() {\n"
              "        _hideBottomNavOnReaderScroll = false;\n"
              "      });\n"
              "    }\n\n",
              1,
          )

          text = text.replace(
              "Expanded(child: pageView),",
              "Expanded(\n"
              "  child: NotificationListener<ScrollNotification>(\n"
              "    onNotification: (notification) => _handleReaderScrollNotification(\n"
              "      notification,\n"
              "      orientation: orientation,\n"
              "      currentScreen: state.currentScreen,\n"
              "    ),\n"
              "    child: pageView,\n"
              "  ),\n"
              "),",
          )

          nav_start = text.index("return NavigationBar(")
          new_nav_start = (
              "final hideBottomNav = orientation == Orientation.portrait &&\n"
              "                                                      state.currentScreen == Screen.reading &&\n"
              "                                                      _hideBottomNavOnReaderScroll;\n"
              "                                                  return AnimatedSize(\n"
              "                                                    duration: const Duration(milliseconds: 180),\n"
              "                                                    curve: Curves.easeOutCubic,\n"
              "                                                    alignment: Alignment.topCenter,\n"
              "                                                    child: hideBottomNav\n"
              "                                                        ? const SizedBox.shrink()\n"
              "                                                        : NavigationBar("
          )
          text = text[:nav_start] + new_nav_start + text[nav_start + len("return NavigationBar("):]

          nav_end_old = "                                                  );\n                                                },"
          nav_end = text.index(nav_end_old, nav_start)
          nav_end_new = "                                                  ),\n                                                  );\n                                                },"
          text = text[:nav_end] + nav_end_new + text[nav_end + len(nav_end_old):]

          path.write_text(text)
          PY

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Normalize app metadata for sideloading
        run: |
          set -euo pipefail
          APP_PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${ALTSTORE_DISPLAY_NAME}" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${ALTSTORE_DISPLAY_NAME}" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PLIST"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "${IPA_NAME}.ipa" Payload
          unzip -tq "${IPA_NAME}.ipa"
          zipinfo -1 "${IPA_NAME}.ipa" | head -20
          ls -lh "${IPA_NAME}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: build/ios/ipa/${{ env.IPA_NAME }}.ipa
          if-no-files-found: error
          retention-days: 14
