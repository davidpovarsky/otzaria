name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/ios-stability-20260623
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

env:
  IPA_NAME: Otzaria-unsigned

jobs:
  build-ios-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "${IPA_NAME}.ipa" Payload
          shasum -a 256 "${IPA_NAME}.ipa" > "${IPA_NAME}.ipa.sha256"
          ls -lh "${IPA_NAME}.ipa" "${IPA_NAME}.ipa.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: |
            build/ios/ipa/${{ env.IPA_NAME }}.ipa
            build/ios/ipa/${{ env.IPA_NAME }}.ipa.sha256
          if-no-files-found: error
          retention-days: 14
